<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Último Refugio - Realidad Virtual Web</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- Librería para movimiento con joystick y colisiones de terreno -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
</head>

<body>
    <a-scene vr-mode-ui="enabled: true">
        <!-- Luces ambientales y direccionales para dar volumen al modelo 3D -->
        <a-light type="ambient" color="#95a5a6"></a-light>
        <a-light type="directional" position="2 4 -2" color="#dfe6e9" intensity="0.6"></a-light>

        <a-assets>
            <img id="cielo-contaminado" src="assets/images/cielo_contaminado.jpg">
            <audio id="musica-fondo" src="assets/audio/music3.mp3" preload="auto"></audio>
        </a-assets>
        <a-sound id="reproductor-musica" src="#musica-fondo" autoplay="false" loop="true" volume="0.5"
            positional="false">
        </a-sound>
        <!-- Entorno: Cielo y suelo -->
        <a-sky src="#cielo-contaminado"></a-sky>

        <!-- IMPORTAR MODELO .GLB -->
        <!-- position: x y z | scale: tamaño (ancho alto profundidad) -->
        <a-gltf-model src="assets/models/Terreno_UR.glb" position="-0.217 1.796 21.871" scale="1 1 1" nav-mesh
            class="suelo">
        </a-gltf-model>
        <a-gltf-model src="assets/models/Objetos_UR.glb" position="-0.346 1.796 -0.0069" scale="1 1 1">
        </a-gltf-model>

        <!-- Rig del Jugador con soporte de movimiento (Meta Quest 3) -->
        <a-entity id="rig" movement-controls="speed: 0.2; constrainToNavMesh: True; camera: #camera" position="0 0.2 0">

            <!-- Cámara -->
            <a-camera id="camera" position="0 1.6 0">
                <a-cursor color="#ff7675" fuse="true" fuse-timeout="1500"
                    raycaster="objects: .interactuable"></a-cursor>
            </a-camera>

            <!-- Controlador Izquierdo de Meta Quest 3 (con rayo láser) -->
            <a-entity laser-controls="hand: left" raycaster="objects: .interactuable; far: 20"></a-entity>

            <!-- Controlador Derecho de Meta Quest 3 (con rayo láser) -->
            <a-entity laser-controls="hand: right" raycaster="objects: .interactuable; far: 20"></a-entity>

        </a-entity>
        <!-- Hotspot 1: Zona del Río -->
        <a-ring class="interactuable" hotspot="destino: 0.043 1.481 1.017" position="0.043 1.481 1.017"
            scale="0.45 0.45 0.45" rotation="-90 0 0" radius-inner="0.25" radius-outer="0.4"
            material="color: #00cec9; shader: flat; opacity: 0.8"
            animation="property: scale; to: 1.15 1.15 1.15; dir: alternate; loop: true; dur: 1000">
        </a-ring>
        <!-- Hotspot 1.5: Zona del Río -->
        <a-ring class="interactuable" hotspot="destino: 0.021 1.481 2.348" position="0.021 1.481 2.348"
            scale="0.45 0.45 0.45" rotation="-90 0 0" radius-inner="0.25" radius-outer="0.4"
            material="color: #00cec9; shader: flat; opacity: 0.8"
            animation="property: scale; to: 1.15 1.15 1.15; dir: alternate; loop: true; dur: 1000">
        </a-ring>
        <!-- Hotspot 1.7: Zona del Río -->
        <a-ring class="interactuable" hotspot="destino: 0.099 1.481 4.492" position="0.099 1.481 4.492"
            scale="0.45 0.45 0.45" rotation="-90 0 0" radius-inner="0.25" radius-outer="0.4"
            material="color: #00cec9; shader: flat; opacity: 0.8"
            animation="property: scale; to: 1.15 1.15 1.15; dir: alternate; loop: true; dur: 1000">
        </a-ring>
        <!-- Hotspot 1.9: Zona del Río -->
        <a-ring class="interactuable" hotspot="destino: -1.087 1.481 4.492" position="-1.087 1.481 4.492"
            scale="0.45 0.45 0.45" rotation="-90 0 0" radius-inner="0.25" radius-outer="0.4"
            material="color: #00cec9; shader: flat; opacity: 0.8"
            animation="property: scale; to: 1.15 1.15 1.15; dir: alternate; loop: true; dur: 1000">
        </a-ring>
        <!-- Hotspot 2: Base o Cima de la Montaña (Cerca del ecorrecuerdo del cielo) -->
        <a-ring class="interactuable" hotspot="destino: -1.055 1.481 0.001" position="-1.055 1.481 0.001"
            scale="0.45 0.45 0.45" rotation="-90 0 0" radius-inner="0.25" radius-outer="0.4"
            material="color: #00cec9; shader: flat; opacity: 0.8"
            animation="property: scale; to: 1.15 1.15 1.15; dir: alternate; loop: true; dur: 1000">
        </a-ring>
        <!-- Hotspot 2.2: Base o Cima de la Montaña (Cerca del ecorrecuerdo del cielo) -->
        <a-ring class="interactuable" hotspot="destino: -2.545 1.491 -0.569" position="-1.055 1.481 0.001"
            scale="0.45 0.45 0.45" rotation="-90 0 0" radius-inner="0.25" radius-outer="0.4"
            material="color: #00cec9; shader: flat; opacity: 0.8"
            animation="property: scale; to: 1.15 1.15 1.15; dir: alternate; loop: true; dur: 1000">
        </a-ring>
        <!-- Hotspot 3: Zona del Árbol -->
        <a-ring class="interactuable" hotspot="destino: -1.7 1.8 3.5" position="-1.7 1.85 3.5" scale="0.45 0.45 0.45"
            rotation="-90 0 0" radius-inner="0.25" radius-outer="0.4"
            material="color: #00cec9; shader: flat; opacity: 0.8"
            animation="property: scale; to: 1.15 1.15 1.15; dir: alternate; loop: true; dur: 1000">
        </a-ring>

        <!-- Hotspot 4: zona de animales -->
        <a-ring class="interactuable" hotspot="destino: -3.5 5.2 -5.5" position="-3.5 5.25 -5.5" sacle="0.45 0.45 0.45"
            rotation="-90 0 0" radius-inner="0.25" radius-outer="0.4"
            material="color: #00cec9; shader: flat; opacity: 0.8"
            animation="property: scale; to: 1.15 1.15 1.15; dir: alternate; loop: true; dur: 1000">
        </a-ring>

        <!-- Contenedores de los Ecorrecuerdos -->

        <!-- Cristal exterior (Octaedro) - ecorrecuerdo cielo -->
        <a-octahedron id="cristal-1" class="interactuable" radius="0.45" position="-3.996 6.656 -6.433"
            scale="0.7 1.3 0.7"
            material="color: #00cec9; opacity: 0.45; transparent: true; roughness: 0.1; metalness: 0.8"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
        </a-octahedron>

        <!-- Esfera interna con la imagen -->
        <a-sphere id="esfera-recuerdo-1" radius="0.22"
            material="src: assets/images/ecorrecuerdo_cielo.png; side: double; shader: flat; repeat: -1 1"
            position="-3.996 6.679 -6.433" scale="0.886 0.886 0.886"
            animation="property: rotation; to: 0 -360 0; loop: true; dur: 12000; easing: linear">
        </a-sphere>
        <!-- Cristal exterior (Octaedro) - ecorrecuerdo arbol  -->
        <a-octahedron id="cristal-2" class="interactuable" radius="0.45" position="5.418 1.997 1.169"
            scale="0.7 1.3 0.7"
            material="color: #00cec9; opacity: 0.45; transparent: true; roughness: 0.1; metalness: 0.8"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
        </a-octahedron>

        <!-- Esfera interna con la imagen -->
        <a-sphere id="esfera-recuerdo-2" radius="0.22"
            material="src: assets/images/ecorrecuerdo_arbol.png; side: double; shader: flat; repeat: -1 1"
            position="5.418 2.029 1.169" scale="0.886 0.886 0.886"
            animation="property: rotation; to: 0 -360 0; loop: true; dur: 12000; easing: linear">
        </a-sphere>
        <!-- Cristal exterior (Octaedro) - ecorrecuerdo rio -->
        <a-octahedron id="cristal-3" class="interactuable" radius="0.45" position="-1.765 1.968 4.446"
            scale="0.7 1.3 0.7"
            material="color: #00cec9; opacity: 0.45; transparent: true; roughness: 0.1; metalness: 0.8"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
        </a-octahedron>

        <!-- Esfera interna con la imagen -->
        <a-sphere id="esfera-recuerdo-3" radius="0.22"
            material="src: assets/images/ecorrecuerdo_agua.avif; side: double; shader: flat; repeat: -1 1"
            position="-1.765 1.973 4.446" scale="0.886 0.886 0.886"
            animation="property: rotation; to: 0 -360 0; loop: true; dur: 12000; easing: linear">
        </a-sphere>
        <!-- Cristal exterior (Octaedro) - ecorrecuerdo animales -->
        <a-octahedron id="cristal-4" class="interactuable" radius="0.45" position="4.755 1.992 -3.756"
            scale="0.7 1.3 0.7"
            material="color: #00cec9; opacity: 0.45; transparent: true; roughness: 0.1; metalness: 0.8"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
        </a-octahedron>

        <!-- Esfera interna con la imagen -->
        <a-sphere id="esfera-recuerdo-4" radius="0.22"
            material="src: assets/images/ecorrecuerdo_animal.png; side: double; shader: flat; repeat: -1 1"
            position="4.755 1.998 -3.756" scale="0.886 0.886 0.886"
            animation="property: rotation; to: 0 -360 0; loop: true; dur: 12000; easing: linear">
        </a-sphere>
    </a-scene>
    <script>
        const escena = document.querySelector('a-scene');
        const musica = document.querySelector('#reproductor-musica');
        let iniciada = false;

        function iniciarMusica() {
            if (!iniciada && musica.components.sound) {
                musica.components.sound.playSound();
                iniciada = true;
            }
        }

        // Se activa al hacer clic en pantalla o al entrar a las gafas VR
        window.addEventListener('click', iniciarMusica);
        escena.addEventListener('enter-vr', iniciarMusica);
    </script>
</body>

</html>
