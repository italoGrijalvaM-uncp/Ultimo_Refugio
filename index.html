<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Último Refugio - Realidad Virtual Web</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

    <script>
        // 1. Componente de salto con gravedad
        AFRAME.registerComponent('salto', {
            schema: {
                fuerza: { type: 'number', default: 5.5 },
                gravedad: { type: 'number', default: -14 }
            },
            init: function () {
                this.velocidadY = 0;
                this.enElAire = false;
                this.alturaBase = this.el.object3D.position.y;

                window.addEventListener('keydown', (e) => {
                    if (e.code === 'Space' && !this.enElAire) {
                        this.alturaBase = this.el.object3D.position.y;
                        this.velocidadY = this.data.fuerza;
                        this.enElAire = true;
                        this.el.setAttribute('movement-controls', 'constrainToNavMesh', false);
                    }
                });
            },
            tick: function (time, timeDelta) {
                if (!this.enElAire) return;
                const dt = Math.min(timeDelta / 1000, 0.05);
                const pos = this.el.object3D.position;

                pos.y += this.velocidadY * dt;
                this.velocidadY += this.data.gravedad * dt;

                if (pos.y <= this.alturaBase) {
                    pos.y = this.alturaBase;
                    this.velocidadY = 0;
                    this.enElAire = false;
                    this.el.setAttribute('movement-controls', 'constrainToNavMesh', true);
                }
            }
        });

        // 2. Componente para envolver al jugador dentro de la esfera del ecorrecuerdo
        AFRAME.registerComponent('ecorrecuerdo-portal', {
            schema: {
                esferaId: { type: 'string' }
            },
            init: function () {
                this.envuelto = false;
                this.esferaEl = null;

                // Esperamos a que toda la escena termine de inicializarse
                this.el.sceneEl.addEventListener('loaded', () => {
                    this.esferaEl = document.querySelector(this.data.esferaId);
                    this.camaraEl = document.querySelector('#camera');
                    this.destelloEl = document.querySelector('#destello-transicion');

                    if (!this.esferaEl) {
                        console.error('No se encontró la esfera:', this.data.esferaId);
                        return;
                    }

                    // Leemos posiciones directamente desde Three.js (nunca falla)
                    const p = this.esferaEl.object3D.position;
                    this.posOriginal = { x: p.x, y: p.y, z: p.z };

                    const s = this.esferaEl.object3D.scale;
                    this.escalaOriginal = { x: s.x, y: s.y, z: s.z };
                });

                this.el.addEventListener('mouseenter', () => {
                    if (!this.envuelto && this.esferaEl) this.activarEnvoltura();
                });

                this.el.addEventListener('mouseleave', () => {
                    if (this.envuelto && this.esferaEl) this.desactivarEnvoltura();
                });
            },
            lanzarDestello: function () {
                if (!this.destelloEl) return;
                this.destelloEl.setAttribute('visible', true);
                this.destelloEl.removeAttribute('animation__brillo');
                this.destelloEl.setAttribute('animation__brillo', {
                    property: 'material.opacity',
                    from: 0.85,
                    to: 0,
                    dur: 650,
                    easing: 'easeOutQuad'
                });
                setTimeout(() => {
                    this.destelloEl.setAttribute('visible', false);
                }, 660);
            },
            activarEnvoltura: function () {
                this.envuelto = true;
                this.lanzarDestello();

                const posCamara = new THREE.Vector3();
                this.camaraEl.object3D.getWorldPosition(posCamara);

                // Evita que el terreno corte la esfera mientras estás adentro
                const mesh = this.esferaEl.getObject3D('mesh');
                if (mesh) {
                    mesh.material.depthTest = false;
                    mesh.renderOrder = 999;
                }
                this.esferaEl.setAttribute('position', posCamara);
                this.esferaEl.removeAttribute('animation__escala');
                this.esferaEl.setAttribute('animation__escala', {
                    property: 'scale',
                    to: '6 6 6',
                    dur: 700,
                    easing: 'easeOutExpo'
                });
            },
            desactivarEnvoltura: function () {
                this.envuelto = false;
                this.lanzarDestello();

                this.esferaEl.removeAttribute('animation__escala');
                this.esferaEl.setAttribute('animation__escala', {
                    property: 'scale',
                    to: `${this.escalaOriginal.x} ${this.escalaOriginal.y} ${this.escalaOriginal.z}`,
                    dur: 500,
                    easing: 'easeInOutQuad'
                });

                setTimeout(() => {
                    if (!this.envuelto) {
                        this.esferaEl.setAttribute('position', this.posOriginal);
                    }
                }, 480);
            }
        });
    </script>
</head>

<body>
    <a-scene vr-mode-ui="enabled: true" loading-screen="dotsColor: #00cec9; backgroundColor: #111">
        <!-- Luces -->
        <a-light type="ambient" color="#95a5a6"></a-light>
        <a-light type="directional" position="2 4 -2" color="#dfe6e9" intensity="0.6"></a-light>

        <a-assets>
            <img id="cielo-contaminado" src="assets/images/cielo_contaminado.png">
            <audio id="musica-fondo" src="assets/audio/backgroundmusic.mp3" preload="auto"></audio>
        </a-assets>

        <a-sound id="reproductor-musica" src="#musica-fondo" autoplay="false" loop="true" volume="1.5"
            positional="false">
        </a-sound>

        <!-- Entorno -->
        <a-sky src="#cielo-contaminado"></a-sky>

        <!-- Modelos 3D -->
        <a-gltf-model src="assets/models/TerrenoUR.glb" position="-0.346 4.971 -0.007" scale="1 1 1" nav-mesh
            class="suelo">
        </a-gltf-model>
        <a-gltf-model src="assets/models/ObjetosUR.glb" position="-0.346 4.971 -0.007" scale="1 1 1">
        </a-gltf-model>

        <!-- Rig del Jugador -->
        <a-entity id="rig" movement-controls="speed: 0.08; constrainToNavMesh: true; camera: #camera" salto
            position="0 0.2 0">

            <!-- Cámara -->
            <a-camera id="camera" position="0 1.6 0" look-controls="pointerLockEnabled: false"
                wasd-controls="enabled: false">
                <a-cursor color="#ff7675" fuse="true" fuse-timeout="1500"
                    raycaster="objects: .interactuable"></a-cursor>

                <!-- Esfera de destello (inicia con visible="false") -->
                <a-sphere id="destello-transicion" radius="0.4" visible="false"
                    material="color: #81ecec; shader: flat; side: back; transparent: true; opacity: 0">
                </a-sphere>
            </a-camera>

            <!-- Controladores Meta Quest 3 -->
            <a-entity laser-controls="hand: left" raycaster="objects: .interactuable; far: 20"></a-entity>
            <a-entity laser-controls="hand: right" raycaster="objects: .interactuable; far: 20"></a-entity>
        </a-entity>

        <!-- Contenedores de los Ecorrecuerdos -->

        <!-- Ecorrecuerdo 1: Cielo -->
        <a-octahedron id="cristal-1" class="interactuable" ecorrecuerdo-portal="esferaId: #esfera-recuerdo-1"
            radius="0.45" position="-10.915 11.765 -14.081" scale="0.7 1.3 0.7"
            material="color: #00cec9; opacity: 0.45; transparent: true; roughness: 0.1; metalness: 0.8"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
        </a-octahedron>
        <a-sphere id="esfera-recuerdo-1" radius="0.22"
            material="src: assets/images/ecorrecuerdo_cielo.png; side: double; shader: flat; repeat: -1 1; dephtTest: false"
            position="-10.915 11.770 -14.081" scale="0.886 0.886 0.886"
            animation="property: rotation; to: 0 -360 0; loop: true; dur: 12000; easing: linear">
        </a-sphere>

        <!-- Ecorrecuerdo 2: Árbol -->
        <a-octahedron id="cristal-2" class="interactuable" ecorrecuerdo-portal="esferaId: #esfera-recuerdo-2"
            radius="0.45" position="10.695 2.316 2.460" scale="0.7 1.3 0.7"
            material="color: #00cec9; opacity: 0.45; transparent: true; roughness: 0.1; metalness: 0.8"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
        </a-octahedron>
        <a-sphere id="esfera-recuerdo-2" radius="0.22"
            material="src: assets/images/ecorrecuerdo_arbol.png; side: double; shader: flat; repeat: -1 1; depthTest: false"
            position="10.695 2.321 2.460" scale="0.886 0.886 0.886"
            animation="property: rotation; to: 0 -360 0; loop: true; dur: 12000; easing: linear">
        </a-sphere>

        <!-- Ecorrecuerdo 3: Río -->
        <a-octahedron id="cristal-3" class="interactuable" ecorrecuerdo-portal="esferaId: #esfera-recuerdo-3"
            radius="0.45" position="8.024 2.446 -13.310" scale="0.7 1.3 0.7"
            material="color: #00cec9; opacity: 0.45; transparent: true; roughness: 0.1; metalness: 0.8"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
        </a-octahedron>
        <a-sphere id="esfera-recuerdo-3" radius="0.22"
            material="src: assets/images/ecorrecuerdo_agua.avif; side: double; shader: flat; repeat: -1 1; depthTest: false"
            position="8.024 2.451 -13.310" scale="0.886 0.886 0.886"
            animation="property: rotation; to: 0 -360 0; loop: true; dur: 12000; easing: linear">
        </a-sphere>

        <!-- Ecorrecuerdo 4: Animales -->
        <a-octahedron id="cristal-4" class="interactuable" ecorrecuerdo-portal="esferaId: #esfera-recuerdo-4"
            radius="0.45" position="-5.148 1.992 9.057" scale="0.7 1.3 0.7"
            material="color: #00cec9; opacity: 0.45; transparent: true; roughness: 0.1; metalness: 0.8"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
        </a-octahedron>
        <a-sphere id="esfera-recuerdo-4" radius="0.22"
            material="src: assets/images/ecorrecuerdo_animal.png; side: double; shader: flat; repeat: -1 1; depthTest: false"
            position="-5.148 1.997 9.057" scale="0.886 0.886 0.886"
            animation="property: rotation; to: 0 -360 0; loop: true; dur: 12000; easing: linear">
        </a-sphere>
    </a-scene>

    <script>
        const escena = document.querySelector('a-scene');
        const musica = document.querySelector('#reproductor-musica');
        let iniciada = false;

        function iniciarMusica() {
            if (!iniciada && musica.components.sound) {
                musica.components.sound.playSound();
                iniciada = true;
            }
        }

        window.addEventListener('click', iniciarMusica);
        escena.addEventListener('enter-vr', iniciarMusica);
    </script>
</body>

</html>
