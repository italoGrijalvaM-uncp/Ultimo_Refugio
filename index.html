    <!-- Librería para movimiento con joystick y colisiones de terreno -->

        <!-- Luces ambientales y direccionales para dar volumen al modelo 3D -->

        <a-sky src="#cielo-contaminado"></a-sky>

        <!-- IMPORTAR MODELO .GLB -->
        <!-- position: x y z | scale: tamaño (ancho alto profundidad) -->

            class="suelo">
        </a-gltf-model>
        <a-gltf-model src="assets/models/Objetos_UR.glb" position="-0.346 1.796 -0.0069" scale="1 1 1">
        </a-gltf-model>

        <!-- Rig del Jugador con soporte de movimiento (Meta Quest 3) -->
        <a-entity id="rig" movement-controls="speed: 0.2; constrainToNavMesh: True; camera: #camera" position="0 0.2 0">

            <!-- Cámara -->
            <a-camera id="camera" position="0 1.6 0">
                <a-cursor color="#ff7675" fuse="true" fuse-timeout="1500"
                    raycaster="objects: .interactuable"></a-cursor>
            </a-camera>

            <!-- Controlador Izquierdo de Meta Quest 3 (con rayo láser) -->
            <a-entity laser-controls="hand: left" raycaster="objects: .interactuable; far: 20"></a-entity>

            <!-- Controlador Derecho de Meta Quest 3 (con rayo láser) -->
            <a-entity laser-controls="hand: right" raycaster="objects: .interactuable; far: 20"></a-entity>

    <script>
        // Componente corregido para hotspots por mirada o clic
        AFRAME.registerComponent('hotspot', {
            schema: {
                destino: { type: 'vec3' }
            },
            init: function () {
                this.el.addEventListener('click', (evt) => {
                    const rig = document.querySelector('#rig');
                    rig.setAttribute('position', this.data.destino);
                });
            }
        });

        const escena = document.querySelector('a-scene');
        const musica = document.querySelector('#reproductor-musica');
        let iniciada = false;

        function iniciarMusica() {
            if (!iniciada && musica.components.sound) {
                musica.components.sound.playSound();
                iniciada = true;
            }
        }

        window.addEventListener('click', iniciarMusica);
        escena.addEventListener('enter-vr', iniciarMusica);
    </script>
